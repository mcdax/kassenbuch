name: Build and Push Docker image

run-name: Build and Push Docker image by ${{ github.actor }}
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          pip install -e '.[dev]'
          pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Private repo: the image goes to the self-hosted registry, which the servers are logged in to
      - name: Login to registry.smol.uk
        uses: docker/login-action@v3
        with:
          registry: registry.smol.uk
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.smol.uk/kassenbuch:latest
